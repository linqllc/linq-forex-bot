[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linq-supply-demand-v13"
version = "13.0.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
